<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Layout-Demo mit --align</title>
<link rel="stylesheet" href="layout.css">
<style>

  body {
    font-family: sans-serif;
  }

  .demo-frame {
    min-height: 320px;
    outline: 1px solid #000;
  }

  .panel {
    padding: 4px 8px;
    outline: 1px solid #aaa;
    font-size: 0.85rem;
  }

  /* --- Dashboard-Ebenen --- */

  .demo-frame > header         { --align: top;      background: #cce; }
  .demo-frame > .searchbar     { --align: top-2;    background: #ddf; }
  .demo-frame > .contextbar    { --align: top-3;    background: #eef; }

  .demo-frame > nav            { --align: left;     background: #cec; }
  .demo-frame > .favorites     { --align: left-2;   background: #dfd; }

  .demo-frame > main           { --align: client;   background: #fff; }
  .demo-frame > aside.inspector{ --align: right;    background: #fcc; }
  .demo-frame > footer         { --align: bottom;   background: #cce; }
  .demo-frame > .statusline    { --align: bottom-2; background: #ddf; }

  /* --- Hauptinhalt-Ebenen --- */

  main > .breadcrumbs   { --align: top;    background: #ffe; }
  main > .toolbar       { --align: top-2;  background: #ffd; }
  main > section        { --align: client; background: #f9f9f9; }
  main > .actionbar     { --align: bottom; background: #ffe; }

  /* --- Inhaltsschicht-Ebenen --- */

  main > section > .article-header { --align: top;    background: #eee; }
  main > section > .chapters       { --align: left;   background: #ddd; }
  main > section > article         { --align: client; background: #fff; }
  main > section > .notes          { --align: right;  background: #fdd; }
  main > section > .status         { --align: bottom; background: #dfd; }

  /* --- Mobil (< 600px): nur wesentliche Bereiche, alles gestapelt --- */

  @media (max-width: 599px) {
    /* Seitenleisten und Nebenelemente ausblenden */
    .demo-frame > .searchbar,
    .demo-frame > .contextbar,
    .demo-frame > .favorites,
    .demo-frame > aside.inspector,
    .demo-frame > .statusline,
    main > .toolbar,
    main > section > .chapters,
    main > section > .notes    { display: none; }

    /* Navigation unter den Header */
    .demo-frame > nav          { --align: top-2; }

    /* Aktionsleiste oben im main statt unten */
    main > .actionbar          { --align: top-3; }
  }

  /* --- Tablet (600px – 1023px): Inspector ausblenden, Kontextleiste erhalten --- */

  @media (600px <= width <= 1023px) {
    .demo-frame > .contextbar,
    .demo-frame > .statusline,
    .demo-frame > aside.inspector { display: none; }
  }

  /* --- Desktop (≥ 1024px): Vollansicht, alles sichtbar --- */

  @media (min-width: 1024px) {
    /* alles wie definiert, keine Änderungen nötig */
  }

</style>
</head>
<body>

<h2>Mehrschichtiges Dashboard</h2>

  <div class="frame demo-frame">
    <header class="panel">App Header</header>
    <div class="panel searchbar">Suchleiste / Filter</div>
    <div class="panel contextbar">Kontextleiste</div>

    <nav class="panel">Navigation</nav>
    <aside class="panel favorites">Favoriten</aside>

    <main class="frame">
      <div class="panel breadcrumbs">Breadcrumbs</div>
      <div class="panel toolbar">Werkzeugleiste</div>

      <section class="frame">
        <div class="panel article-header">Artikelkopf</div>
        <div class="panel chapters">Kapitel</div>
        <article class="panel">Inhaltsschicht</article>
        <div class="panel notes">Notizen</div>
        <div class="panel status">Status</div>
      </section>

      <div class="panel actionbar">Aktionsleiste</div>
    </main>

    <aside class="panel inspector">Inspector</aside>
    <footer class="panel">Footer</footer>
    <div class="panel statusline">Statuszeile</div>
  </div>

</body>
</html>
